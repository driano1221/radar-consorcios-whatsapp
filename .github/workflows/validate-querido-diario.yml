name: Diagnóstico dedicado do Querido Diário sem envios
on:
  push:
    branches: [fix/querido-diario-domain]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEND_ENABLED: 'false'
      PERSIST_STATE: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/check-recovery-safety.mjs --before
      - name: Testar domínio anunciado, API, proxy, backend público, curl e PDF real
        run: node scripts/diagnose-querido-diario.mjs
      - name: Confirmar acervo, decisões, fila, recibos e sessão intactos
        if: always()
        run: |
          node scripts/check-recovery-safety.mjs
          git diff --exit-code HEAD -- state data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: querido-diario-diagnosis-${{ github.run_id }}
          path: output/querido-diario-diagnosis/
          retention-days: 14
