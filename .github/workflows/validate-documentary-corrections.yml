name: Validar revisão documental sem envios

on:
  push:
    branches: [fix/primary-documents-retroactive]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Conferir reaplicação sem efeito
        run: node scripts/apply-primary-document-corrections.mjs --apply
      - run: npm run dashboard:build:public
      - run: node scripts/check-public-dashboard.mjs
      - name: Acervo e estado de envio devem continuar intactos
        run: git diff --exit-code HEAD -- data state
