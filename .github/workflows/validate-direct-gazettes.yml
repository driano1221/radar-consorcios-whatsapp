name: Validar diários diretos e RNCP sem envios
on:
  push:
    branches: [feat/direct-gazettes-rncp]
  workflow_dispatch:
    inputs:
      pagination_only:
        description: Validar somente a retomada de MG e PE em duas rodadas sem envios
        type: boolean
        default: false
      review_ai:
        description: Executar também a revisão opcional com a API de IA configurada
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEND_ENABLED: 'false'
      PERSIST_STATE: 'false'
      AI_REVIEW_ENABLED: 'false'
      AI_PREVIEW: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-extraction.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-extraction.txt
      - name: Conferir rotas públicas RNCP e pilha HTTP sem autenticação
        if: inputs.pagination_only != true
        run: node scripts/probe-rncp-access.mjs
      - run: npm run check && npm test
      - run: node scripts/check-recovery-safety.mjs --before
      - name: Ler índices e íntegras reais, classificar e bloquear histórico
        if: inputs.pagination_only != true
        run: node scripts/validate-direct-gazettes.mjs
      - name: Retomar MG e PE em duas rodadas sem alterar estado
        if: inputs.pagination_only == true
        run: node scripts/validate-gazette-pagination.mjs
      - name: Conferir cinco textos públicos com IA e prova literal sem aplicar decisões
        if: inputs.review_ai == true && inputs.pagination_only != true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/validate-direct-gazettes-ai.mjs
      - name: Testar integração completa sem IA paga, sessão ou envio
        if: inputs.pagination_only != true
        run: npm run collect
      - name: Gerar e validar painel com as fontes configuradas
        if: inputs.pagination_only != true
        run: npm run dashboard:build:public && node scripts/check-public-dashboard.mjs
      - name: Confirmar documentos, decisões e recibos intactos
        if: always()
        run: |
          node scripts/check-recovery-safety.mjs
          git diff --exit-code HEAD -- data state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-gazettes-${{ github.run_id }}
          path: |
            output/direct-gazettes/
            output/gazette-pagination/report.json
            output/source-health.json
            output/source-funnel.json
            output/classification-audit.json
            output/preview.txt
          retention-days: 14
