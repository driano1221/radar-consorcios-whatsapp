name: Simulação v6 de originais sem envios
on:
  push:
    branches: [test/original-triage-v6]
    paths: [docs/simulacao-v6-amostra-nova.json, scripts/simulate-original-v6.mjs, .github/workflows/simulate-original-v6.yml]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Simular nova política sem aplicação ou WhatsApp
        run: node scripts/simulate-original-v6.mjs --ai
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Garantir dados e código de produção intactos
        if: always()
        run: git diff --exit-code HEAD -- data state config src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-v6
          path: output/original-v6/
          retention-days: 7
