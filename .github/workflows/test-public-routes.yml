name: Testar rotas públicas sem envios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consultar rotas públicas e validar conteúdo
        run: node scripts/probe-public-routes.mjs
      - name: Confirmar que não alterou dados nem estado de envio
        run: git diff --exit-code HEAD -- data state
      - uses: actions/upload-artifact@v4
        with:
          name: public-routes-diagnostic
          path: output/public-routes/report.json
          retention-days: 7
