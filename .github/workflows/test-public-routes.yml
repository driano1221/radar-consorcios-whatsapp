name: Testar rotas públicas sem envios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fotografar histórico e envios
        run: node scripts/check-recovery-safety.mjs --before
      - name: Consultar rotas públicas e validar conteúdo
        run: node scripts/probe-public-routes.mjs
      - name: Validar coletores de produção em duas passagens sem persistência
        run: node scripts/validate-public-route-collectors.mjs
      - name: Confirmar que não alterou dados nem estado de envio
        run: |
          node scripts/check-recovery-safety.mjs --after
          git diff --exit-code HEAD -- data state
      - uses: actions/upload-artifact@v4
        with:
          name: public-routes-diagnostic
          path: output/public-routes/report.json
          retention-days: 7
