name: Validar triagem alternativa sem envios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node scripts/check-recovery-safety.mjs --before
      - name: IA real, controles negativos e integração isolada
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/validate-alternative-triage.mjs
      - run: npm run dashboard:build:public
      - name: Conferir histórico, estado e revisões intactos
        if: always()
        run: |
          node scripts/check-recovery-safety.mjs
          git diff --exit-code HEAD -- data state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alternative-triage-validation
          path: output/alternative-triage/
          retention-days: 7
