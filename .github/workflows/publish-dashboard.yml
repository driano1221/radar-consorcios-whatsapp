name: Publicar painel do Radar

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: radar-consorcios-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a versão atual do projeto
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Gerar painel público com a base atualizada
        run: npm run dashboard:build:public
      - name: Validar conteúdo publicado
        run: node scripts/check-public-dashboard.mjs
      - name: Enviar apenas o painel gerado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
