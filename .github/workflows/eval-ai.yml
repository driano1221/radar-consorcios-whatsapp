name: Avaliação pontual de IA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/eval-ai.mjs --deepseek
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avaliacao-ia-${{ github.run_id }}
          path: output/ai-eval-*.json
          retention-days: 7
