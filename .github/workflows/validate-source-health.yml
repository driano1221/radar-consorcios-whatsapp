name: Validar fontes e revisão automática sem envios
on:
  push:
    branches: [fix/sources-review-oct19]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SEND_ENABLED: 'false'
      PERSIST_STATE: 'false'
      AI_REVIEW_ENABLED: 'true'
      AI_PREVIEW: 'true'
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-extraction.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-extraction.txt
      - run: npm run check
      - run: npm test
      - run: node scripts/check-recovery-safety.mjs --before
      - name: Conferir publicações SVG, rotas públicas e IA no caso real
        run: node scripts/validate-source-health-fixes.mjs
      - name: Coleta completa em simulação com IA e sem sessão WhatsApp
        run: npm run collect
      - name: Conferir painel
        run: npm run dashboard:build:public && node scripts/check-public-dashboard.mjs
      - name: Confirmar arquivo, decisões, fila, recibos e sessão intactos
        if: always()
        run: |
          node scripts/check-recovery-safety.mjs
          git diff --exit-code HEAD -- data state
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-health-fixes-${{ github.run_id }}
          path: |
            output/source-health-fixes/
            output/source-health.json
            output/source-funnel.json
            output/article-enrichment-audit.json
            output/ai-review-audit.json
            output/classification-audit.json
            output/preview.txt
          retention-days: 14
