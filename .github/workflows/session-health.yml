name: Saúde da sessão do WhatsApp

on:
  schedule:
    - cron: '41 8 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-consorcios-whatsapp
  cancel-in-progress: false

jobs:
  verificar-sessao:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BOT_STATE_PASSWORD: ${{ secrets.BOT_STATE_PASSWORD }}
      WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Restaurar sessão criptografada
        run: npm run session:decrypt

      - name: Verificar sessão e grupo
        run: npm run session:check

      - name: Atualizar sessão criptografada
        if: always()
        run: npm run session:encrypt

      - name: Persistir sessão
        if: always()
        shell: bash
        run: |
          git config user.name "radar-consorcios[bot]"
          git config user.email "radar-consorcios[bot]@users.noreply.github.com"
          git add -- state/auth.enc state/auth.sha256
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de sessão."
            exit 0
          fi
          git commit -m "chore: atualizar sessão do WhatsApp [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
