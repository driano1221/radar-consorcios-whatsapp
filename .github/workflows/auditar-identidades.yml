name: Recuperar evidências de identidade dos PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar leitor de PDF
        run: python -m pip install 'pypdf==6.10.0'

      - name: Recuperar trechos com número da página
        run: python scripts/recover-identity-pdf.py

      - name: Guardar auditoria em ramo separado
        run: |
          git config user.name "radar-consorcios[bot]"
          git config user.email "radar-consorcios[bot]@users.noreply.github.com"
          git add -- data/catalogo/recuperacao-pdf.ndjson
          git commit -m "data: recuperar trechos de PDFs para auditoria [skip ci]"
          git push origin HEAD:refs/heads/audit/recuperacao-identidades
