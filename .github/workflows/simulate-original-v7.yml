name: Integração documental v7 sem aplicação ou envios
on:
  push:
    branches: [test/original-triage-v7]
    paths: [docs/simulacao-v7-resultado.json, scripts/simulate-original-v7.mjs, scripts/lib/original-v7.mjs, scripts/audit-original-v7.mjs, src/lib/primary-evidence.mjs, tests/original-v7-safety.test.mjs, tests/primary-evidence-integration.test.mjs, .github/workflows/simulate-original-v7.yml]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - name: Repetir integração e amostra com respostas congeladas, sem API
        run: node scripts/simulate-original-v7.mjs --frozen
      - name: Auditar provas e referência anterior à IA
        run: node scripts/audit-original-v7.mjs output/original-v7/report.json
      - name: Validar pacote público sem publicar
        run: npm run dashboard:build:public
      - name: Garantir dados, estado e configuração preservados
        if: always()
        run: git diff --exit-code HEAD -- data state config
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-v7
          path: output/original-v7/
          retention-days: 7
