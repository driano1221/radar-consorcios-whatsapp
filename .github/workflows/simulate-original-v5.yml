name: Simulação v5 de originais sem envios
on:
  push:
    branches: [test/original-triage-v5]
    paths: [docs/simulacao-v5-amostra-nova.json, scripts/simulate-original-v5.mjs, .github/workflows/simulate-original-v5.yml]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Simulação sem aplicação nem WhatsApp
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/simulate-original-v5.mjs --ai
      - name: Garantir dados e código de produção intactos
        if: always()
        run: git diff --exit-code HEAD -- data state config src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-v5
          path: output/original-v5/
          retention-days: 7
