name: Repetir simulação v3.2 com respostas congeladas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Replay de todos os 82 documentos, sem API ou envios
        run: node scripts/simulate-original-triage.mjs --answers docs/simulacao-v31-respostas-congeladas.json
      - name: Verificar arquivos protegidos
        if: always()
        run: git diff --exit-code HEAD -- data state config src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-triage-simulation-v32
          path: output/original-triage-simulation/
          retention-days: 7
