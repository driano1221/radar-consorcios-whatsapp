# Temporary dispatch bridge ON EXPERIMENT BRANCH ONLY; restored after the run.
name: Simular triagem de originais sem alterar base
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Simular 40 originais, 18 adicionais e 12 sem revisão anterior
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/simulate-original-triage.mjs --ai
      - name: Comprovar base e estado intactos
        if: always()
        run: git diff --exit-code HEAD -- data state config src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-triage-simulation
          path: output/original-triage-simulation/
          retention-days: 7
