# Temporary dispatch bridge ON EXPERIMENT BRANCH ONLY; restored after the run.
name: Simular triagem de originais sem alterar base
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prova suplementar da política histórica aprovada pelo usuário
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/probe-original-shadow.mjs 20264127
      - name: Comprovar base e estado intactos
        if: always()
        run: git diff --exit-code HEAD -- data state config src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-shadow-probe
          path: output/original-shadow-probe/
          retention-days: 7
