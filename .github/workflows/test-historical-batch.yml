name: Simular originais v3 sem base ou WhatsApp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Simular 70 documentos fixos e 12 textos novos sem aplicar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/simulate-original-triage.mjs --ai
      - name: Verificar arquivos protegidos
        if: always()
        run: git diff --exit-code HEAD -- data state config src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-triage-simulation-v3
          path: output/original-triage-simulation/
          retention-days: 7
