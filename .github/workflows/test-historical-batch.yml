name: Simulação isolada de originais nesta branch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/original-triage-shadow.test.mjs
      - name: Simular 40 originais com IA sem aplicar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/simulate-original-triage.mjs --ai
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-triage-simulation
          path: output/original-triage-simulation/
          retention-days: 7
      - name: Confirmar produção e estado de envio intactos
        if: always()
        run: git diff --exit-code HEAD -- data state config src
