name: Radar de Consórcios

on:
  schedule:
    # a cada 2 horas: o GitHub já pulava a maioria dos disparos de 15 em 15 min, e agenda
    # muito frequente é padrão de abuso (conta sinalizada em 23/09/2026)
    - cron: '17 */2 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:
    inputs:
      send_enabled:
        description: Publicar os candidatos no WhatsApp nesta execução
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-consorcios-whatsapp
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BOT_STATE_PASSWORD: ${{ secrets.BOT_STATE_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED || 'true' }}
      WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
      SEND_ENABLED: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.send_enabled) || vars.SEND_ENABLED || 'false' }}
      PERSIST_STATE: ${{ github.event_name == 'schedule' || inputs.send_enabled }}

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Evitar coletas repetidas por atraso do agendador
        id: freshness
        run: node scripts/should-collect.mjs

      - name: Instalar dependências
        if: steps.freshness.outputs.run == 'true'
        run: npm ci

      - name: Testes de regressão
        if: steps.freshness.outputs.run == 'true'
        run: npm test

      - name: Restaurar sessão criptografada
        if: steps.freshness.outputs.run == 'true' && env.SEND_ENABLED == 'true'
        run: npm run session:decrypt

      - name: Executar radar
        if: steps.freshness.outputs.run == 'true'
        run: npm run collect

      - name: Atualizar sessão criptografada
        if: always() && steps.freshness.outputs.run == 'true' && env.SEND_ENABLED == 'true'
        run: npm run session:encrypt

      - name: Persistir sessão e notícias enviadas
        if: always() && steps.freshness.outputs.run == 'true' && env.PERSIST_STATE == 'true'
        shell: bash
        run: |
          git config user.name "radar-consorcios[bot]"
          git config user.email "radar-consorcios[bot]@users.noreply.github.com"
          git add -- state/auth.enc state/auth.sha256 state/news-state.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de estado."
            exit 0
          fi
          git commit -m "chore: atualizar estado do radar [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Guardar relatórios de coleta
        if: always() && steps.freshness.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ github.run_id }}
          path: |
            output/*preview.txt
            output/source-health.json
            output/source-funnel.json
            output/classification-audit.json
            output/ai-review-audit.json
          retention-days: 7

      - name: Alertar falhas persistentes
        if: always() && github.ref_name == 'main' && (steps.freshness.outputs.run == 'true' || failure())
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_STATUS: ${{ job.status }}
        run: npm run health:report
