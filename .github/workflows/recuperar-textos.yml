name: Recuperar textos antigos

on:
  schedule:
    - cron: '37 3 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-consorcios-whatsapp
  cancel-in-progress: false

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar Python para leitura de notícias
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-extraction.txt
      - name: Instalar Trafilatura
        run: python -m pip install -r requirements-extraction.txt
      - name: Recuperar até 20 textos sem enviar ao WhatsApp
        run: node scripts/backfill-article-text.mjs --limit=20 --apply
      - name: Recuperar até 20 títulos antigos do Google Notícias
        run: node scripts/backfill-article-text.mjs --title-only-google --retry-failed --limit=20 --apply
      - name: Localizar prova por página em até 10 PDFs antigos
        run: node scripts/backfill-google-pdfs.mjs --retry-failed --limit=10 --apply
      - name: Atualizar sugestões sem publicar automaticamente
        run: node scripts/review-recovered-texts.mjs --apply
      - name: Guardar resultados na base
        shell: bash
        run: |
          git config user.name "radar-consorcios[bot]"
          git config user.email "radar-consorcios[bot]@users.noreply.github.com"
          git add -- data/catalogo
          if git diff --cached --quiet; then
            echo "Nenhum texto ou tentativa nova."
            exit 0
          fi
          git commit -m "chore: recuperar textos antigos [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
