name: Recuperar textos antigos

on:
  schedule:
    - cron: '37 3 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:
    inputs:
      ids:
        description: IDs completos separados por vírgula (vazio = recuperação normal)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: radar-consorcios-whatsapp
  cancel-in-progress: false

jobs:
  recuperar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RECOVERY_IDS: ${{ inputs.ids || '' }}
    outputs:
      catalog_changed: ${{ steps.persist.outputs.changed }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar Python para leitura de notícias
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-extraction.txt
      - name: Instalar Trafilatura
        run: python -m pip install -r requirements-extraction.txt
      - name: Testes de regressão
        run: npm test
      - name: Registrar invariantes antes da recuperação
        run: node scripts/check-recovery-safety.mjs --before
      - name: Preparar OCR seletivo para PDFs públicos
        if: env.RECOVERY_IDS == ''
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por
      - name: Recuperar PDFs de Guanhães e alternativas Semana 7, CNM e Araguaia com proveniência
        if: env.RECOVERY_IDS == ''
        run: node scripts/recover-public-documents.mjs --apply
      - name: Recuperar casos específicos sem classificar nem enviar
        if: env.RECOVERY_IDS != ''
        shell: bash
        run: |
          if ! [[ "$RECOVERY_IDS" =~ ^[a-f0-9]{64}(,[a-f0-9]{64})*$ ]]; then
            echo "IDs inválidos"; exit 1
          fi
          node scripts/backfill-article-text.mjs --ids="$RECOVERY_IDS" --force --include-sent --apply
      - name: Recuperar até 20 textos sem enviar ao WhatsApp
        if: env.RECOVERY_IDS == ''
        run: node scripts/backfill-article-text.mjs --limit=20 --include-sent --apply
      - name: Recuperar até 20 títulos antigos do Google Notícias
        if: env.RECOVERY_IDS == ''
        run: node scripts/backfill-article-text.mjs --title-only-google --retry-failed --limit=20 --include-sent --apply
      - name: Localizar prova por página em até 10 PDFs antigos
        if: env.RECOVERY_IDS == ''
        run: node scripts/backfill-google-pdfs.mjs --retry-failed --limit=10 --apply
      - name: Atualizar sugestões sem publicar automaticamente
        if: env.RECOVERY_IDS == ''
        run: node scripts/review-recovered-texts.mjs --apply
      - name: Triar fontes alternativas de registros novos sem enviar
        if: env.RECOVERY_IDS == ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/triage-alternative-texts.mjs --apply
      - name: Verificar que não duplicou nem alterou envios ou revisões
        run: node scripts/check-recovery-safety.mjs
      - name: Guardar resultados na base
        id: persist
        shell: bash
        run: |
          git config user.name "radar-consorcios[bot]"
          git config user.email "radar-consorcios[bot]@users.noreply.github.com"
          git add -- data/catalogo
          if git diff --cached --quiet; then
            echo "Nenhum texto ou tentativa nova."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: recuperar textos antigos [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish_dashboard:
    needs: recuperar
    if: needs.recuperar.outputs.catalog_changed == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-dashboard.yml
