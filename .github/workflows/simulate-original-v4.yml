name: Simulação v4 de originais sem envios
on:
  push:
    branches: [test/original-triage-v4]
    paths: [docs/simulacao-v4-amostra-nova.json, scripts/simulate-original-v4.mjs, .github/workflows/simulate-original-v4.yml]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Repetir 82 respostas congeladas e ler 12 originais novos para o teste
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/simulate-original-v4.mjs --ai
      - name: Nenhuma alteração de produção ou estado
        if: always()
        run: git diff --exit-code HEAD -- data state config src
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-v4
          path: output/original-v4/
          retention-days: 7
